include:
  - remote: https://raw.githubusercontent.com/ika-rwth-aachen/docker-ros/v1.10.0/.gitlab-ci/docker-ros.yml

variables:
  PLATFORM: amd64
  TARGET: dev,run
  BASE_IMAGE: rwthika/ros2:jazzy
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  COMMAND: ros2 launch openads_demo_service openads_demo_service_launch.py
  ENABLE_INDUSTRIAL_CI: true
  LABEL_MAINTAINER: Institute for Automotive Engineering (ika), RWTH Aachen University <opensource@ika.rwth-aachen.de>
  LABEL_AUTHORS: Institute for Automotive Engineering (ika), RWTH Aachen University <opensource@ika.rwth-aachen.de>
