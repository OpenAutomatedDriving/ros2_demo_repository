openadservice:
  name: openads-demo-service
  image: ghcr.io/openads-project/openads_demo_service:v1.0.0
  env:
    # --- name ------
    NAMESPACE: /
    NAME: openads_demo_service
    # --- inputs ----
    INPUT_TOPIC: ~/input
    # --- outputs ---
    OUTPUT_TOPIC: ~/output
    # --- other -----
    SERVICE_TOPIC: ~/service
    LOG_LEVEL: info
    USE_SIM_TIME: false
    PARAMS: /docker-ros/ws/install/openads_demo_service/share/openads_demo_service/config/params.yml
  args:
  - /bin/bash
  - -ic
  - |
    ros2 launch openads_demo_service openads_demo_service_launch.py \
      namespace:=${NAMESPACE} \
      name:=${NAME} \
      log_level:=${LOG_LEVEL} \
      use_sim_time:=${USE_SIM_TIME} \
      params:=${PARAMS} \
      input_topic:=${INPUT_TOPIC} \
      output_topic:=${OUTPUT_TOPIC} \
      service_topic:=${SERVICE_TOPIC}
  rosParamFileMountPath: /docker-ros/ws/install/openads_demo_service/share/openads_demo_service/config/params.yml
  rosParamFileData: null
